# Repo override: review-council.

# Discoverability: review-council lives in this org but isn't one of its
# incubated projects, so it has no section on the Unbound Force site and
# doesn't carry the unbound-force topic. The homepage points at its own
# README. safe-settings replaces the full topic list on sync, so add topics
# here, not in the GitHub UI.
repository:
  homepage: https://github.com/zero-dot-force/review-council#readme
  topics:
    - zero-dot-force
    - code-review
    - ai-agents
    - claude-code
    - cursor
    - gemini-cli
    - opencode
    - lola

# Colors are quoted and keep GitHub's stored case: safe-settings compares
# them as exact strings.
#
# gh-hud's hold label (it auto-merges PRs here). Without this entry a sync
# would delete it, and with it the hold on any PR that carries it.
labels:
  include:
    - name: hold
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"
  exclude:
    - name: ".*"

# Required checks for this repo only. The suborg ruleset is shared, so a
# check there would be required in repos that never run it. GitHub applies
# both rulesets, so the suborg ruleset's approval rule still holds.
#
# "Check module" is ci.yml's job: frontmatter and relative links in
# module/. gh-hud auto-merges PRs here, so nothing should merge before CI.
rulesets:
  - name: "safe-settings: review-council required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          # "CI OK" is ci.yml's always-run aggregate: it passes when the
          # jobs jflowers/ship's pr-scope.yml chose ran and passed, so Dewey
          # learnings and toolkit rollout PRs skip the heavy jobs.
          required_status_checks:
            - context: "CI OK"
