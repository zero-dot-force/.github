# Repo override: reading-stone.
#
# reading-stone releases through its `release.yml` workflow
# (workflow_dispatch with a `tag` input), like gaze. The workflow creates
# the v* tag itself, then stages the npm package from the `npm` environment via
# npm trusted publishing, and creates the GitHub release. The npm trust
# relationship pins that workflow filename and environment name.
#
# Both settings below previously existed only as manual changes on the
# repo; this file makes them declarative.
#
# NOTE: repo-scoped rulesets and environments are fully managed here.
# safe-settings removes any repo-level ruleset or environment on
# reading-stone that is not listed in this file.

# Discoverability: the homepage points at this project's section on the
# Unbound Force site, and the shared unbound-force / zero-dot-force topics
# group the org's repos in search. safe-settings replaces the full topic
# list on sync, so add topics here, not in the GitHub UI.
repository:
  homepage: https://unboundforce.dev/docs/zero-dot-force/#reading-stone
  topics:
    - unbound-force
    - zero-dot-force
    - typescript
    - static-analysis
    - test-quality
    - side-effects
    - gaze
    - json-rpc

rulesets:
  # Release tags are immutable: once a v* tag exists it cannot be deleted
  # or moved. Creation is allowed, so the release workflow's GITHUB_TOKEN
  # can create the tag (GitHub does not accept the GitHub Actions app as a
  # ruleset bypass actor). A hand-pushed tag publishes nothing: release.yml
  # runs only on workflow_dispatch. Org admins may bypass to repair a bad
  # tag. Matches gaze/dewey/replicator's `release-tag-protection`.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward

  # Required CI checks on the default branch. First created outside
  # safe-settings (2026-11-25); declared here so a sync keeps it.
  # Repo admins (RepositoryRole 5) may bypass.
  - name: "ship: required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "test (22)"
            - context: "test (24)"

environments:
  # Gate for the release workflow's stage job. A dispatched run's ref is
  # the branch it runs from (not the tag it creates), so deployments are
  # limited to main. No required reviewers: the npm trust relationship is
  # stage-only and the package requires 2FA, so a maintainer's 2FA
  # approval on npm is the release's one human gate. The environment
  # stays because the trust relationship names it.
  - name: npm
    wait_timer: 0
    prevent_self_review: false
    reviewers: []
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - main

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "blog"
      color: '5319E7'
      description: "Blog / content-pipeline tracking"

    - name: "hold"
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"
  exclude:
    - name: ".*"
