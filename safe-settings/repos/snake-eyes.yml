# Repo override: snake-eyes.
#
# snake-eyes releases through its `release.yml` workflow
# (workflow_dispatch with a tag input), like gaze: the org-infra release
# preflight creates the v* tag with the workflow's GITHUB_TOKEN, then the
# publish job uploads to PyPI via trusted publishing.
#
# NOTE: repo-scoped rulesets are fully managed by safe-settings. Any
# repo-level ruleset on snake-eyes not declared here or in
# suborgs/code-repos.yml is removed on sync.

# Discoverability: the homepage points at this project's section on the
# Unbound Force site, and the shared unbound-force / zero-dot-force topics
# group the org's repos in search. safe-settings replaces the full topic
# list on sync, so add topics here, not in the GitHub UI.
repository:
  homepage: https://unboundforce.dev/docs/zero-dot-force/#snake-eyes
  topics:
    - unbound-force
    - zero-dot-force
    - python
    - static-analysis
    - test-quality
    - side-effects
    - gaze
    - json-rpc

rulesets:
  # Release tags are immutable: once a v* tag exists it cannot be deleted
  # or moved. Creation is allowed, so the release workflow's GITHUB_TOKEN
  # can create the tag (GitHub does not accept the GitHub Actions app as a
  # ruleset bypass actor). Org admins may bypass to repair a bad tag.
  # Matches gaze/dewey/replicator and reading-stone.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward

  # Required CI checks on the default branch. Repo admins
  # (RepositoryRole 5) may bypass.
  - name: "safe-settings: snake-eyes required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "test (3.11)"
            - context: "test (3.12)"

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "hold"
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"
  exclude:
    - name: ".*"
