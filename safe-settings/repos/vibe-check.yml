# Repo override: vibe-check.
#
# NOTE: repo-scoped rulesets are fully managed by safe-settings. Any
# repo-level ruleset on vibe-check not declared here or in
# suborgs/code-repos.yml is removed on sync.

rulesets:
  # Required CI checks on the default branch. First created outside
  # safe-settings (2026-11-25); declared here so a sync keeps it.
  # Repo admins (RepositoryRole 5) may bypass.
  - name: "ship: required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "test"
            - context: "lint"
