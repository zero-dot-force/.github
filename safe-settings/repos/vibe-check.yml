# Repo override: vibe-check.
#
# NOTE: repo-scoped rulesets are fully managed by safe-settings. Any
# repo-level ruleset on vibe-check not declared here or in
# suborgs/code-repos.yml is removed on sync.

# Discoverability: the homepage points at this project's section on the
# Unbound Force site, and the shared unbound-force / zero-dot-force topics
# group the org's repos in search. safe-settings replaces the full topic
# list on sync, so add topics here, not in the GitHub UI.
repository:
  homepage: https://unboundforce.dev/docs/zero-dot-force/#vibe-check
  topics:
    - unbound-force
    - zero-dot-force
    - go
    - cli
    - static-analysis
    - code-quality
    - software-metrics
    - coupling
    - cohesion
    - ai-generated-code

rulesets:
  # Required CI checks on the default branch. Repo admins
  # (RepositoryRole 5) may bypass.
  - name: "safe-settings: vibe-check required checks"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "test"
            - context: "lint"

  # Release tags are immutable: once a v* tag exists it can't be deleted or
  # moved. Creation is allowed, so the release workflow's GITHUB_TOKEN can
  # create the tag (GitHub does not accept the GitHub Actions app as a
  # ruleset bypass actor). Org admins may bypass to repair a bad tag.
  # Matches reading-stone and snake-eyes; vibe-check releases v* tags too.
  - name: release-tag-protection
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - "refs/tags/v*"
        exclude: []

    bypass_actors:
      - actor_id: null
        actor_type: OrganizationAdmin
        bypass_mode: always

    rules:
      - type: deletion
      - type: non_fast_forward

# Labels in use on issues and PRs. Without these entries the org's
# exclude rule would delete them on a sync. hold and human-gate are
# gh-hud's (it auto-merges PRs here); github_actions and go are
# Dependabot's. Colors are quoted and keep GitHub's stored case:
# safe-settings compares them as exact strings.
labels:
  include:
    - name: "architecture"
      color: '5319E7'
      description: "Architectural design and cross-cutting concerns"

    - name: "epic"
      color: '3E4B9E'
      description: "Umbrella issue tracking a group of related work items"

    - name: "hold"
      color: 'B60205'
      description: "gh-hud: don't auto-merge; a person looks first"

    - name: "P0"
      color: 'B60205'
      description: "Critical priority \u2014 Phase 1 foundation"

    - name: "P1"
      color: 'D93F0B'
      description: "High priority \u2014 Phase 1\u20132"

    - name: "P2"
      color: 'FBCA04'
      description: "Medium priority \u2014 Phase 3"

    - name: "P3"
      color: '0E8A16'
      description: "Low priority \u2014 Phase 4 / future"

    - name: "repo:dewey"
      color: '006B75'
      description: "Lands in the dewey repo"

    - name: "repo:gaze"
      color: '1D76DB'
      description: "Lands in the gaze repo"

    - name: "repo:snake-eyes"
      color: '0052CC'
      description: "Lands in the snake-eyes repo"

    - name: "repo:unbound-force"
      color: '0075CA'
      description: "Lands in the unbound-force repo"
  exclude:
    - name: ".*"
