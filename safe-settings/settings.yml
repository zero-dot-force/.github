# Organization-wide repository settings for the zero-dot-force GitHub org.
# Applied to all managed repos. Suborg and repo-level overrides can
# extend but not weaken these defaults (enforced by override validators).
#
# IMPORTANT: This file must NOT set fields owned by peribolos:
#   description, has_projects, default_branch
#
# Excluded from safe-settings management:
#   .github: admin repo (avoids circular dependency)

repository:
  # Allow auto-merge on pull requests when all requirements are met.
  allow_auto_merge: true

  # Automatically delete head branches after pull requests are merged.
  delete_branch_on_merge: true

  # Merge strategies — all enabled org-wide, matching current state.
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true

  # Allow the "Update branch" button on PRs.
  allow_update_branch: true

  # Disable wiki org-wide. Documentation lives in dedicated repos.
  has_wiki: false

  has_issues: true
  has_downloads: true

  # Dependabot vulnerability alerts and automated security fixes.
  security:
    enableVulnerabilityAlerts: true
    enableAutomatedSecurityFixes: true

# Standard labels across all repos. Additive only: the catch-all
# exclude keeps safe-settings from deleting labels it does not declare
# (e.g. reading-stone's `blog`, gh-hud's `hold`). Treat label deletion
# as a separately reviewed change.
labels:
  include:
    - name: bug
      color: d73a4a
      description: Something isn't working

    - name: documentation
      color: 0075ca
      description: Improvements or additions to documentation

    - name: duplicate
      color: cfd3d7
      description: This issue or pull request already exists

    - name: enhancement
      color: a2eeef
      description: New feature or request

    - name: good first issue
      color: '7057ff'
      description: Good for newcomers

    - name: help wanted
      color: '008672'
      description: Extra attention is needed

    - name: invalid
      color: e4e669
      description: This doesn't seem right

    - name: question
      color: d876e3
      description: Further information is requested

    - name: wontfix
      color: ffffff
      description: This will not be worked on

  exclude:
    - name: ".*"

# No org-level rulesets: zero-dot-force is on the GitHub Free plan, where
# org rulesets are unavailable (the API returns "Upgrade to GitHub Team").
# Branch rulesets are repo-scoped and live in the suborg files instead
# (see suborgs/code-repos.yml).
