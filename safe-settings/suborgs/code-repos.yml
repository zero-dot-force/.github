# Suborg: code repositories.
# These repos contain source code and require strict security controls:
# required code owner reviews, required status checks, and stale review
# dismissal.
#
# Org-wide defaults from settings.yml are inherited automatically.
# Only override settings here if code repos need different values
# than the org-wide defaults.

suborgrepos:
  - reading-stone
  - review-council
  - snake-eyes
  - vibe-check

# Branch ruleset for code repos — strict default-branch protection.
# Repo-scoped (one ruleset per repo, created by safe-settings) because
# org-level rulesets need GitHub Team and zero-dot-force is on Free.
# Repo-level override files may add further rulesets; safe-settings merges
# them with this one by name.
rulesets:
  - name: "safe-settings: code repos"
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []

    rules:
      # Restrict creation of refs matching the default branch pattern.
      # Prevents recreating the default branch if deleted.
      - type: creation

      # Prevent deletion of the default branch.
      - type: deletion

      # Prevent force pushes to the default branch.
      - type: non_fast_forward

      # Pull request requirements.
      # Baseline: 1 approver, dismiss stale reviews, code owner review,
      # last push approval.
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_last_push_approval: true
          required_review_thread_resolution: false

      # Preserve any status checks configured outside of safe-settings
      # (e.g., via individual repo workflow configurations).
      - type: required_status_checks
        parameters:
          # Not strict: with auto-merge, each merge would leave every other
          # open PR behind, and updating one needs a fresh approval.
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: "{{EXTERNALLY_DEFINED}}"
