# Workflow to apply safe-settings org configuration.
# Manual dispatch only — add push/schedule triggers after initial validation.
# Uses a dedicated safe-settings-bot GitHub App for authentication.
#
# safe-settings reads config from the admin repo's default branch (main).
# Config must be merged to main before this workflow can apply it.
#
# See MAINTAINING.md for operational documentation.
name: Safe Settings Sync

"on":
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview changes without applying (NOP mode)'
        required: false
        type: boolean
        default: true
      repos:
        description: >-
          Comma-separated list of repos to target (e.g. "snake-eyes").
          Leave empty to apply to all managed repos.
        required: false
        type: string
        default: ''

permissions:
  contents: none

concurrency:
  group: safe-settings-sync
  cancel-in-progress: false

env:
  SAFE_SETTINGS_CODE_DIR: ".safe-settings-code"

jobs:
  sync:
    if: github.repository_owner == 'zero-dot-force'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout zero-dot-force/.github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate safe-settings YAML syntax
        run: yamllint safe-settings/

      - name: Generate scoped deployment-settings
        if: inputs.repos != ''
        env:
          TARGET_REPOS: ${{ inputs.repos }}
        run: |
          echo "Scoping safe-settings to repos: $TARGET_REPOS"

          # Build an include allowlist from explicitly managed repository names.
          mapfile -t ALLOWED_REPOS < <(
            yq -r '.restrictedRepos.include[]' safe-settings/deployment-settings.yml
          )
          declare -A allowed_repos
          declare -A selected_repos
          for repo in "${ALLOWED_REPOS[@]}"; do
            allowed_repos["$repo"]=1
          done

          INCLUDE_LIST=""
          IFS=',' read -ra TARGETS <<< "$TARGET_REPOS"
          for target in "${TARGETS[@]}"; do
            target=$(echo "$target" | xargs)  # trim whitespace
            if [[ ! "$target" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid repository name: $target" >&2
              exit 1
            fi
            if [[ -z "${allowed_repos[$target]+x}" ]]; then
              echo "Repository is not managed by Safe Settings: $target" >&2
              exit 1
            fi
            if [[ -n "${selected_repos[$target]+x}" ]]; then
              echo "Repository was specified more than once: $target" >&2
              exit 1
            fi
            selected_repos["$target"]=1
            INCLUDE_LIST="${INCLUDE_LIST}    - ${target}"$'\n'
          done

          # Write scoped deployment-settings.yml (preserving validators
          # from the original file)
          {
            echo "# Auto-generated: scoped to repos: $TARGET_REPOS"
            echo "restrictedRepos:"
            echo "  include:"
            echo -n "$INCLUDE_LIST"
            # Append validators from original file
            echo ""
            yq -r 'del(.restrictedRepos) | select(. != null)' \
              safe-settings/deployment-settings.yml
          } > "$RUNNER_TEMP/scoped-deployment-settings.yml"

          echo "--- Generated deployment-settings.yml ---"
          cat "$RUNNER_TEMP/scoped-deployment-settings.yml"

      - name: Checkout safe-settings code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: github/safe-settings
          ref: '6a8b6ae084987025f6c5de85e3cc6df140f64502'
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Install safe-settings dependencies
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        run: npm ci

      - name: Run safe-settings sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          GH_ORG: zero-dot-force
          ADMIN_REPO: .github
          CONFIG_PATH: safe-settings
          DEPLOYMENT_CONFIG_FILE: >-
            ${{ inputs.repos != '' && format('{0}/scoped-deployment-settings.yml', runner.temp)
            || format('{0}/safe-settings/deployment-settings.yml', github.workspace) }}
          FULL_SYNC_NOP: ${{ inputs.dry-run }}
          LOG_LEVEL: ${{ inputs.dry-run && 'debug' || 'info' }}
        run: |
          if [ "$FULL_SYNC_NOP" = "true" ]; then
            echo "=== DRY-RUN MODE: Showing what would change ==="
          fi
          # --- Workaround for upstream check_suite bug ---
          #
          # In NOP mode, safe-settings 2.1.19's Settings.handleResults
          # reports through a PR comment, reading payload.check_run
          # .check_suite, which is undefined outside the webhook flow, so
          # full-sync crashes after the plugins ran. Catching that crash
          # also hid every plugin ERROR result: a dry run with errors
          # reported success.
          #
          # Instead, wrap handleResults: record every ERROR result and
          # logged error, then fail the step. In NOP mode, log the
          # results instead of commenting; otherwise call upstream's,
          # which only creates the Safe-Settings check run and works here.
          #
          # Upstream issue: github-community-projects/safe-settings#818
          # Upstream fix:   github-community-projects/safe-settings#1018,
          #                 merged by #1047, released in 3.0.0
          #
          # TODO(safe-settings-818): Remove this patched script and
          # revert to 'npm run full-sync' once we pin to 3.0.0 or later.
          #
          # --- Repo-name race (safe-settings#851) ---
          #
          # Fixed upstream by #943, released in 2.1.19, the version pinned
          # above, so no patch is needed here. This workflow carried one
          # while it ran 2.1.18 (#43).
          #
          # ---
          cat > full-sync-patched.js << 'ENDPATCH'
          const appFn = require('./')
          const Settings = require('./lib/settings')
          const { FULL_SYNC_NOP } = require('./lib/env')
          const { createProbot } = require('probot')

          const failures = new Set()

          // Workaround: github-community-projects/safe-settings#818
          const upstreamHandleResults = Settings.prototype.handleResults
          Settings.prototype.handleResults = async function () {
            const results = (this.results || []).filter(Boolean)
            for (const res of results) {
              if (res.type === 'ERROR') {
                failures.add(`${res.plugin} ${res.repo}: ${res.action && res.action.msg}`)
              }
            }
            for (const err of this.errors || []) {
              failures.add(`${err.plugin} ${err.repo}: ${err.msg}`)
            }
            if (this.nop) {
              this.log.info(`Sync results: ${JSON.stringify(results, null, 2)}`)
              return
            }
            return upstreamHandleResults.call(this)
          }

          async function performFullSync (appFn, nop) {
            const probot = createProbot()
            await probot.ready()
            probot.log.info(`Starting full sync with NOP=${nop}`)
            const app = appFn(probot, {})
            await app.syncInstallation(nop)
            if (failures.size > 0) {
              for (const f of failures) {
                process.stdout.write(`::error::${String(f).replace(/\r?\n/g, ' ')}\n`)
              }
              process.exit(1)
            }
            probot.log.info('Full sync completed successfully.')
          }

          performFullSync(appFn, FULL_SYNC_NOP).catch((error) => {
            console.error('Fatal error during full sync:', error)
            process.exit(1)
          })
          ENDPATCH
          node full-sync-patched.js
