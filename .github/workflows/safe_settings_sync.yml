# Workflow to apply safe-settings org configuration.
# Manual dispatch only — add push/schedule triggers after initial validation.
# Uses a dedicated safe-settings-bot GitHub App for authentication.
#
# safe-settings reads config from the admin repo's default branch (main).
# Config must be merged to main before this workflow can apply it.
#
# See MAINTAINING.md for operational documentation.
name: Safe Settings Sync

"on":
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview changes without applying (NOP mode)'
        required: false
        type: boolean
        default: true
      repos:
        description: >-
          Comma-separated list of repos to target (e.g. "snake-eyes").
          Leave empty to apply to all managed repos.
        required: false
        type: string
        default: ''
      version:
        description: >-
          safe-settings commit SHA or tag to use.
          Default is 2.1.18 (last version compatible with Probot v13).
          Includes workaround for check_suite bug (#818) in full-sync
          mode. See TODO(safe-settings-818) in the sync step.
        required: false
        type: string
        default: '594f3c706de6c4ddafb1a86dfa7468f19337e54f'

permissions:
  contents: none

concurrency:
  group: safe-settings-sync
  cancel-in-progress: false

env:
  SAFE_SETTINGS_CODE_DIR: ".safe-settings-code"

jobs:
  sync:
    if: github.repository_owner == 'zero-dot-force'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout zero-dot-force/.github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate safe-settings YAML syntax
        run: yamllint safe-settings/

      - name: Generate scoped deployment-settings
        if: inputs.repos != ''
        env:
          TARGET_REPOS: ${{ inputs.repos }}
        run: |
          echo "Scoping safe-settings to repos: $TARGET_REPOS"

          # Build an include (allowlist) from the target repos.
          # Uses the same format as deployment-settings.yml: plain names
          # matched by safe-settings via glob/minimatch (not regex).
          INCLUDE_LIST=""
          IFS=',' read -ra TARGETS <<< "$TARGET_REPOS"
          for target in "${TARGETS[@]}"; do
            target=$(echo "$target" | xargs)  # trim whitespace
            INCLUDE_LIST="${INCLUDE_LIST}    - ${target}"$'\n'
          done

          # Write scoped deployment-settings.yml (preserving validators
          # from the original file)
          {
            echo "# Auto-generated: scoped to repos: $TARGET_REPOS"
            echo "restrictedRepos:"
            echo "  include:"
            echo -n "$INCLUDE_LIST"
            # Append validators from original file
            echo ""
            yq -r 'del(.restrictedRepos) | select(. != null)' \
              safe-settings/deployment-settings.yml
          } > /tmp/scoped-deployment-settings.yml

          echo "--- Generated deployment-settings.yml ---"
          cat /tmp/scoped-deployment-settings.yml

      - name: Checkout safe-settings code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: github/safe-settings
          ref: ${{ inputs.version }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install safe-settings dependencies
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        run: npm ci

      - name: Run safe-settings sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          GH_ORG: zero-dot-force
          ADMIN_REPO: .github
          CONFIG_PATH: safe-settings
          DEPLOYMENT_CONFIG_FILE: >-
            ${{ inputs.repos != '' && '/tmp/scoped-deployment-settings.yml'
            || format('{0}/safe-settings/deployment-settings.yml', github.workspace) }}
          FULL_SYNC_NOP: ${{ inputs.dry-run }}
          LOG_LEVEL: ${{ inputs.dry-run && 'debug' || 'info' }}
        run: |
          if [ "$FULL_SYNC_NOP" = "true" ]; then
            echo "=== DRY-RUN MODE: Showing what would change ==="
          fi
          # --- Workaround for upstream check_suite bug ---
          #
          # safe-settings v2.1.18's Settings.handleResults reports via a
          # Check Run / PR comment, reading payload.check_suite, which is
          # undefined outside the webhook flow, so full-sync crashes after
          # the plugins ran. Catching that crash also swallowed every
          # plugin ERROR result, so failed syncs reported success.
          #
          # Instead, replace handleResults: log the results and record
          # whether any plugin returned an ERROR, then fail the step.
          #
          # Upstream issue: github-community-projects/safe-settings#818
          # Upstream fix:   github-community-projects/safe-settings#1018
          #
          # TODO(safe-settings-818): Remove this patched script and
          # revert to 'npm run full-sync' once upstream PR #1018 is
          # merged and we pin to the fixed version.
          #
          # --- Workaround for upstream repo-name race ---
          #
          # v2.1.18's Settings.updateRepos runs for every repo at once
          # (Promise.all) and stamps each repo's name onto the one shared
          # org-level `repository` object (Object.assign in place). After
          # an await, every repo's Repository plugin PATCHes whichever
          # name was stamped last: a rename of every other repo. GitHub
          # refuses it only because that name is taken (422 "name already
          # exists on this account").
          #
          # Instead, hand each read of the org-level and suborg-level
          # `repository` block a fresh shallow copy, as upstream does.
          #
          # Upstream issue: github-community-projects/safe-settings#851
          # Upstream fix:   github-community-projects/safe-settings#943
          #                 (released in 2.1.19)
          #
          # TODO(safe-settings-851): Remove the repository-copy patch
          # once we pin to 2.1.19 or later.
          #
          # ---
          cat > full-sync-patched.js << 'ENDPATCH'
          const appFn = require('./')
          const Settings = require('./lib/settings')
          const { FULL_SYNC_NOP } = require('./lib/env')
          const { createProbot } = require('probot')

          const failures = []

          // Workaround: github-community-projects/safe-settings#818
          Settings.prototype.handleResults = async function () {
            const results = (this.results || []).filter(Boolean)
            this.log.info(`Sync results: ${JSON.stringify(results, null, 2)}`)
            for (const res of results) {
              if (res.type === 'ERROR') {
                failures.push(`${res.plugin} ${res.repo}: ${res.action && res.action.msg}`)
              }
            }
            for (const err of this.errors || []) {
              failures.push(`${err.plugin} ${err.repo}: ${err.msg}`)
            }
          }

          // Workaround: github-community-projects/safe-settings#851
          function copyRepositoryOnRead (config) {
            const desc = config && Object.getOwnPropertyDescriptor(config, 'repository')
            if (!desc || desc.get || !desc.value) return
            const shared = desc.value
            Object.defineProperty(config, 'repository', {
              enumerable: true,
              configurable: true,
              get: () => ({ ...shared })
            })
          }
          const origUpdateRepos = Settings.prototype.updateRepos
          Settings.prototype.updateRepos = function (repo) {
            copyRepositoryOnRead(this.config)
            return origUpdateRepos.call(this, repo)
          }
          const origGetSubOrgConfig = Settings.prototype.getSubOrgConfig
          Settings.prototype.getSubOrgConfig = function (repoName) {
            const subOrgConfig = origGetSubOrgConfig.call(this, repoName)
            if (!subOrgConfig || !subOrgConfig.repository) return subOrgConfig
            return { ...subOrgConfig, repository: { ...subOrgConfig.repository } }
          }

          async function performFullSync (appFn, nop) {
            const probot = createProbot()
            probot.log.info(`Starting full sync with NOP=${nop}`)
            const app = appFn(probot, {})
            await app.syncInstallation(nop)
            if (failures.length > 0) {
              for (const f of failures) {
                process.stdout.write(`::error::${f.replace(/\r?\n/g, ' ')}\n`)
              }
              process.exit(1)
            }
            probot.log.info('Full sync completed successfully.')
          }

          performFullSync(appFn, FULL_SYNC_NOP).catch((error) => {
            console.error('Fatal error during full sync:', error)
            process.exit(1)
          })
          ENDPATCH
          node full-sync-patched.js
