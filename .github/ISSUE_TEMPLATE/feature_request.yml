name: "🚀 Feature request"
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to do, and what gets in the way today? Starting
        with the problem helps us find the best fix, which may not be the
        first one that comes to mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
      description: How you'd like it to work, from the user's side.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use now, or other tools that do this.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I'd like to open a pull request"
        - "Maybe, with some guidance"
        - "No, just suggesting it"
    validations:
      required: true
