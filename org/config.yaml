orgs:
  zero-dot-force:
    # Org settings
    # The org website (unboundforce.dev) is set through the API; peribolos
    # has no field for it.
    name: Zero Dot Force
    description: >-
      The junior hero team of Unbound Force: tools that check the quality of
      AI-written code and tests.
    billing_email: jay.flowers@gmail.com
    default_repository_permission: read
    has_organization_projects: true
    has_repository_projects: true
    members_can_create_repositories: false

    # Org members
    admins:
      - em-redhat
      - jflowers
      - marcusburghardt
      - sonupreetam
    members:
      - beatrizmcouto
      - gvauter
      - gxmiranda
      - hbraswelrh
      - jpower432
      - trevor-vaughan
      - tyraziel
      - uf-divisor
      - yvonnedevlinrh

    # Repos managed by peribolos (--fix-repos)
    repos:
      .github:
        default_branch: main
        description: Organization configuration and governance
        has_projects: true
      reading-stone:
        default_branch: main
        description: "TypeScript analyzer for Gaze: finds side effects and maps each test to the assertions that verify them."
        has_projects: true
      snake-eyes:
        default_branch: main
        description: "Python analyzer for Gaze: finds side effects and maps each test to the assertions that verify them."
        has_projects: true
      vibe-check:
        default_branch: main
        description: "Coupling, cohesion and dependency-cycle metrics for Go, Python and TypeScript, to catch structural rot in agent-written code."
        has_projects: true
      review-council:
        default_branch: main
        description: "Six specialist AI reviewers check a change in parallel and return one verdict. A Lola module for Claude Code, Cursor, Gemini CLI and OpenCode."
        has_projects: true

    # Teams
    teams:
      overlords:
        description: ""
        privacy: closed
        members:
          - beatrizmcouto
          - gvauter
          - gxmiranda
          - hbraswelrh
          - jpower432
          - trevor-vaughan
          - uf-divisor
          - yvonnedevlinrh
        maintainers:
          - em-redhat
          - jflowers
          - marcusburghardt
          - sonupreetam
        repos:
          .github: write
          reading-stone: write
          review-council: write
          snake-eyes: write
          vibe-check: write
